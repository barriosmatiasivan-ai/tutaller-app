<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Taller Soft — Portal de Acceso</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z'/></svg>">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .portal-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .portal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-modal);
    }
    .portal-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--emerald-dim);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--emerald-light);
      margin-bottom: 20px;
    }
    .portal-logo svg {
      width: 32px;
      height: 32px;
    }
    .portal-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .portal-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .portal-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .portal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      text-decoration: none;
      transition: all 0.18s ease;
    }
    .portal-btn-primary {
      background: linear-gradient(135deg, var(--emerald-base), #059669);
      color: #fff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
    }
    .portal-btn-primary:hover {
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.38);
      transform: translateY(-1px);
    }
    .portal-btn-secondary {
      background: var(--bg-hover);
      color: var(--text-bright);
      border: 1px solid var(--border-subtle);
    }
    .portal-btn-secondary:hover {
      background: var(--border-subtle);
      border-color: var(--border-strong);
    }
    .portal-btn-outline {
      background: transparent;
      color: var(--emerald-light);
      border: 1px dashed rgba(16, 185, 129, 0.4);
    }
    .portal-btn-outline:hover {
      background: var(--emerald-dim);
      border-color: var(--emerald-base);
    }
    .portal-footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="portal-container">
    <div class="portal-card">
      <div class="portal-logo">
        <svg fill="currentColor" viewBox="0 0 24 24">
          <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
        </svg>
      </div>

      <h1 class="portal-title">Tu Taller Soft</h1>
      <p class="portal-subtitle">
        Plataforma SaaS de gestión técnica, órdenes de reparación con QR y stock para talleres de electrónica y celulares.
      </p>

      <div class="portal-actions">
        <a href="/admin.html" class="portal-btn portal-btn-primary">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          Panel de Administración
        </a>

        <a href="https://demo.tutallersoft.com" class="portal-btn portal-btn-outline" target="_blank" rel="noopener">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          Probar Demo Gratuita (48hs)
        </a>

        <a href="https://tutallersoft.com" class="portal-btn portal-btn-secondary" target="_blank" rel="noopener">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Sitio Web Oficial
        </a>
      </div>

      <div class="portal-footer">
        &copy; 2026 Tu Taller Soft &bull; Infraestructura Multi-Tenant de Alta Disponibilidad
      </div>
    </div>
  </div>
</body>
</html>
